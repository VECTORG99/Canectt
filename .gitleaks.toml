title = "Canectt — gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret expuesto"
regex = '''(?i)GOOGLE_CLIENT_SECRET\s*=\s*['"]?[A-Za-z0-9_\-]{20,}['"]?'''
tags = ["key", "google", "oauth"]

[[rules]]
id = "session-secret"
description = "Session secret expuesto"
regex = '''(?i)SESSION_SECRET\s*=\s*['"]?[A-Za-z0-9_\-/+=]{32,}['"]?'''
tags = ["key", "session"]

[allowlist]
description = "Falsos positivos permitidos"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)docs/.*\.md$''',
  '''(^|/)NOTICE$''',
  '''(^|/)LICENSE$''',
]
